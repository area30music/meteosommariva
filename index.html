<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteo Sommariva del Bosco</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Reset e Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0d1117; /* Sfondo pagina scuro */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
        }

        /* Dimensioni esatte richieste */
        #weather-widget {
            width: 1240px;
            height: 700px;
            background-color: #12141c;
            border-radius: 20px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform:scale(0.55);
            
        }

        /* Sezione Superiore (Oggi) */
        .top-section {
            background-color: #1a1e29;
            border-radius: 20px;
            padding: 40px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 250px;
        }

        .city-info h1 {
            font-size: 55px;
            line-height: 1.1;
            font-weight: 800;
            background: linear-gradient(90deg, #3ab0ff, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .source-text {
            color: #8892b0;
            margin-top: 15px;
            font-size: 16px;
        }

        .source-text span { color: #f39c12; font-weight: 600; }

        .current-weather {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .current-icon svg {
            width: 140px;
            height: 140px;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4));
        }

        .current-temp-info {
            display: flex;
            flex-direction: column;
        }

        .current-temp {
            font-size: 80px;
            font-weight: 800;
            line-height: 1;
        }

        .current-desc {
            font-size: 22px;
            color: #a0aec0;
            margin-top: 10px;
            font-weight: 600;
        }

        .min-max-today {
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
            border-left: 2px solid #2d3748;
            padding-left: 30px;
            gap: 10px;
        }

        .t-max { color: #ff6b6b; }
        .t-min { color: #4facfe; }

        /* Sezione Inferiore (7 Giorni) */
        .forecast-section {
            display: flex;
            justify-content: space-between;
            height: 330px;
        }

        .day-card {
            background-color: #1a1e29;
            width: 150px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 10px;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .day-card:hover { transform: translateY(-5px); }

        .day-name { font-size: 22px; font-weight: 800; color: #4facfe; }
        .day-date { font-size: 14px; color: #8892b0; margin-top: 5px; }
        
        .day-icon svg {
            width: 70px;
            height: 70px;
            margin: 15px 0;
        }

        .day-desc {
            font-size: 13px;
            color: #a0aec0;
            text-align: center;
            height: 35px; /* Spazio fisso per il testo su due righe */
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
            padding: 0 5px;
        }

        .day-temps {
            text-align: center;
            margin-top: 15px;
            font-size: 22px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div id="weather-widget">
        <!-- Top Section -->
        <div class="top-section">
            <div class="city-info">
                <h1>SOMMARIVA<br>DEL BOSCO</h1>
                <div class="source-text">((•)) Fonte: <span>Open-Meteo</span></div>
            </div>
            
            <div class="current-weather">
                <div class="current-icon" id="current-icon"></div>
                <div class="current-temp-info">
                    <div class="current-temp" id="current-temp">--°C</div>
                    <div class="current-desc" id="current-desc">Caricamento...</div>
                </div>
            </div>

            <div class="min-max-today">
                <div>Max: <span class="t-max" id="today-max">--°C</span></div>
                <div>Min: <span class="t-min" id="today-min">--°C</span></div>
            </div>
        </div>

        <!-- Bottom Section (7 Days) -->
        <div class="forecast-section" id="forecast-container">
            <!-- I giorni verranno generati dinamicamente via JS -->
        </div>
    </div>

    <script>
        // Coordinate per Sommariva del Bosco
        const LAT = 44.7667;
        const LON = 7.7833;

        // Libreria Icone SVG in base alle condizioni (Stile Neon/Minimal)
        const icons = {
            sun: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="#ffd700"/><g stroke="#ffd700" stroke-width="6" stroke-linecap="round"><line x1="50" y1="5" x2="50" y2="15"/><line x1="50" y1="85" x2="50" y2="95"/><line x1="5" y1="50" x2="15" y2="50"/><line x1="85" y1="50" x2="95" y2="50"/><line x1="18" y1="18" x2="25" y2="25"/><line x1="75" y1="75" x2="82" y2="82"/><line x1="18" y1="82" x2="25" y2="75"/><line x1="75" y1="25" x2="82" y2="18"/></g></svg>`,
            partlyCloudy: `<svg viewBox="0 0 100 100"><circle cx="40" cy="40" r="20" fill="#ffd700"/><path d="M75,65 a15,15 0 0,0 -10,-14 a20,20 0 0,0 -35,5 a15,15 0 0,0 5,29 h40 a15,15 0 0,0 0,-20 z" fill="#c0cdd9"/></svg>`,
            cloudy: `<svg viewBox="0 0 100 100"><path d="M75,65 a15,15 0 0,0 -10,-14 a20,20 0 0,0 -35,5 a15,15 0 0,0 5,29 h40 a15,15 0 0,0 0,-20 z" fill="#8892b0"/></svg>`,
            lightRain: `<svg viewBox="0 0 100 100"><path d="M75,55 a15,15 0 0,0 -10,-14 a20,20 0 0,0 -35,5 a15,15 0 0,0 5,29 h40 a15,15 0 0,0 0,-20 z" fill="#6a35ff"/><line x1="40" y1="80" x2="35" y2="95" stroke="#b185ff" stroke-width="4" stroke-linecap="round"/><line x1="60" y1="80" x2="55" y2="95" stroke="#b185ff" stroke-width="4" stroke-linecap="round"/></svg>`,
            heavyRain: `<svg viewBox="0 0 100 100" style="filter: drop-shadow(0 0 10px #6a35ff);"><path d="M75,55 a15,15 0 0,0 -10,-14 a20,20 0 0,0 -35,5 a15,15 0 0,0 5,29 h40 a15,15 0 0,0 0,-20 z" fill="#9d4edd"/><line x1="30" y1="80" x2="25" y2="95" stroke="#e0aaff" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="80" x2="45" y2="95" stroke="#e0aaff" stroke-width="4" stroke-linecap="round"/><line x1="70" y1="80" x2="65" y2="95" stroke="#e0aaff" stroke-width="4" stroke-linecap="round"/></svg>`,
            storm: `<svg viewBox="0 0 100 100"><path d="M75,50 a15,15 0 0,0 -10,-14 a20,20 0 0,0 -35,5 a15,15 0 0,0 5,29 h40 a15,15 0 0,0 0,-20 z" fill="#4a4e69"/><polygon points="45,65 55,65 40,85 50,85 35,100" fill="#ffd700"/><line x1="65" y1="75" x2="60" y2="90" stroke="#b185ff" stroke-width="4" stroke-linecap="round"/></svg>`,
            snow: `<svg viewBox="0 0 100 100"><path d="M75,55 a15,15 0 0,0 -10,-14 a20,20 0 0,0 -35,5 a15,15 0 0,0 5,29 h40 a15,15 0 0,0 0,-20 z" fill="#caf0f8"/><circle cx="40" cy="85" r="3" fill="#fff"/><circle cx="60" cy="85" r="3" fill="#fff"/><circle cx="50" cy="95" r="3" fill="#fff"/></svg>`
        };

        // Mappatura codici meteo WMO in descrizioni e icone
        function getWeatherInfo(code) {
            if (code === 0) return { desc: "Soleggiato", icon: icons.sun };
            if (code === 1 || code === 2) return { desc: "Poco Nuvoloso", icon: icons.partlyCloudy };
            if (code === 3) return { desc: "Nuvoloso", icon: icons.cloudy };
            if (code === 45 || code === 48) return { desc: "Nebbia", icon: icons.cloudy };
            if (code === 51 || code === 53 || code === 55) return { desc: "Pioviggine", icon: icons.lightRain };
            if (code === 61 || code === 63) return { desc: "Pioggia Lieve", icon: icons.lightRain };
            if (code === 65) return { desc: "Pioggia Forte", icon: icons.heavyRain };
            if (code === 71 || code === 73 || code === 75 || code === 77) return { desc: "Neve", icon: icons.snow };
            if (code === 80 || code === 81 || code === 82) return { desc: "Acquazzone", icon: icons.heavyRain };
            if (code === 95 || code === 96 || code === 99) return { desc: "Temporale", icon: icons.storm };
            return { desc: "Variabile", icon: icons.partlyCloudy };
        }

        // Formatta la data (Es: "MAR", "8/9")
        function formatDate(dateString) {
            const date = new Date(dateString);
            const days = ['DOM', 'LUN', 'MAR', 'MER', 'GIO', 'VEN', 'SAB'];
            return {
                dayName: days[date.getDay()],
                dayDate: `${date.getDate()}/${date.getMonth() + 1}`
            };
        }

        async function fetchWeather() {
            try {
                // Chiamata API gratuita Open-Meteo
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Europe%2FRome&models=icon_d2`;
                const response = await fetch(url);
                const data = await response.json();

                // Aggiorna Meteo Attuale (Sezione superiore)
                const current = data.current_weather;
                const todayInfo = getWeatherInfo(current.weathercode);
                
                document.getElementById('current-temp').innerText = `${Math.round(current.temperature)}°C`;
                document.getElementById('current-desc').innerText = todayInfo.desc;
                document.getElementById('current-icon').innerHTML = todayInfo.icon;
                
                // Max e Min di oggi
                document.getElementById('today-max').innerText = `${Math.round(data.daily.temperature_2m_max[0])}°C`;
                document.getElementById('today-min').innerText = `${Math.round(data.daily.temperature_2m_min[0])}°C`;

                // Genera i 7 giorni (Sezione inferiore)
                const forecastContainer = document.getElementById('forecast-container');
                forecastContainer.innerHTML = '';

                // Cicliamo sui prossimi 7 giorni
                for (let i = 0; i < 7; i++) {
                    const dateInfo = formatDate(data.daily.time[i]);
                    const wInfo = getWeatherInfo(data.daily.weathercode[i]);
                    const maxT = Math.round(data.daily.temperature_2m_max[i]);
                    const minT = Math.round(data.daily.temperature_2m_min[i]);

                    const cardHTML = `
                        <div class="day-card">
                            <div style="text-align: center;">
                                <div class="day-name">${dateInfo.dayName}</div>
                                <div class="day-date">${dateInfo.dayDate}</div>
                            </div>
                            <div class="day-icon">
                                ${wInfo.icon}
                            </div>
                            <div class="day-desc">${wInfo.desc}</div>
                            <div class="day-temps">
                                <span class="t-max">${maxT}°</span>
                                <span class="t-min">${minT}°</span>
                            </div>
                        </div>
                    `;
                    forecastContainer.innerHTML += cardHTML;
                }

            } catch (error) {
                console.error("Errore nel caricamento del meteo", error);
                document.getElementById('current-desc').innerText = "Errore di caricamento";
            }
        }

        // Avvia la funzione al caricamento della pagina
        fetchWeather();
    </script>
</body>
</html>
