<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1240, height=700, initial-scale=1.0">
    <title>Meteo Sommariva del Bosco</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-card: #1c212a;
            --text-blue: #4fc3f7;
            --text-red: #ff5252;
            --text-min: #82b1ff;
            --text-gray: #a0aab5;
            --text-white: #ffffff;
            --yellow-glow: rgba(255, 183, 77, 0.4);
            --icon-yellow: #ffb74d;
            --icon-cloud: #90a4ae;
            --icon-rain: #29b6f6;
            --icon-storm: #ffb300;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 1240px;
            height: 700px;
            margin: 0;
            overflow: hidden;
        }

        .weather-widget {
            width: 1100px;
            height: 600px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .current-card {
            background-color: var(--bg-card);
            border-radius: 20px;
            padding: 35px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .location-info h1 {
            color: var(--text-blue);
            font-size: 38px;
            font-weight: 900;
            line-height: 1.1;
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }

        .source-info {
            color: var(--text-gray);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .source-info span {
            color: var(--icon-yellow);
            font-weight: bold;
        }

        .current-temp-container {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .weather-icon-main {
            width: 90px;
            height: 90px;
            filter: drop-shadow(0 0 15px var(--yellow-glow));
        }

        .temp-details h2 {
            font-size: 56px;
            font-weight: 700;
            margin: 0;
        }

        .temp-details p {
            color: var(--text-gray);
            margin: 5px 0 0 0;
            font-size: 18px;
        }

        .min-max-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-weight: 700;
            font-size: 18px;
            border-left: 1px solid rgba(255,255,255,0.1);
            padding-left: 30px;
        }

        .min-max-info .max { color: var(--text-red); }
        .min-max-info .min { color: var(--text-min); }

        .forecast-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 20px;
            height: 300px;
        }

        .forecast-card {
            background-color: var(--bg-card);
            border-radius: 20px;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .forecast-date {
            margin-bottom: 25px;
        }

        .forecast-day {
            color: var(--text-blue);
            font-weight: 700;
            font-size: 18px;
            margin: 0;
        }

        .forecast-num {
            color: var(--text-gray);
            font-size: 14px;
            margin: 4px 0 0 0;
        }

        .forecast-icon {
            width: 55px;
            height: 55px;
            margin-bottom: 25px;
            flex-grow: 1;
        }

        .forecast-temps p {
            margin: 6px 0;
            font-weight: 700;
            font-size: 18px;
        }

        .forecast-temps .max { color: var(--text-red); }
        .forecast-temps .min { color: var(--text-min); }
    </style>
</head>
<body>

    <div class="weather-widget">
        <div class="current-card">
            <div class="location-info">
                <h1>SOMMARIVA<br>DEL BOSCO</h1>
                <div class="source-info">
                    (•) Fonte: <span>Open-Meteo</span>
                </div>
            </div>
            
            <div class="current-temp-container">
                <div id="current-icon-wrapper">
                    <!-- Icona principale -->
                </div>
                <div class="temp-details">
                    <h2 id="current-temp">--°C</h2>
                    <p id="current-desc">Caricamento...</p>
                </div>
            </div>

            <div class="min-max-info">
                <div>Max: <span class="max" id="current-max">--°C</span></div>
                <div>Min: <span class="min" id="current-min">--°C</span></div>
            </div>
        </div>

        <div class="forecast-container" id="forecast-container">
        </div>
    </div>

            snow: `<svg class="weather-icon-main" viewBox="0 0 24 24" fill="none"><path d="M17 18H20C20.5523 18 21 17.5523 21 17C21 16.4477 20.5523 16 20 16H18C18 13.7909 16.2091 12 14 12C13.5658 12 13.1492 12.072 12.7634 12.205C12.3152 10.8719 11.0664 9.91992 9.60001 9.91992C8.75232 9.91992 7.97341 10.2526 7.35905 10.8038C6.54117 10.3015 5.58025 10.08 4.60001 10.08C3.17393 10.08 1.83857 10.8358 1.09635 12.0463C0.354131 13.2568 0.29748 14.7836 0.947239 16.0466C1.597 17.3096 2.91572 18.0673 4.33129 18.08C4.55106 18.0822 4.77123 18.0822 4.99268 18.0805C5.55556 18.0805 6 17.6361 6 17.0805C6 16.525 5.55556 16.0805 4.99268 16.0805C4.22681 16.0805 3.52303 15.6888 3.14283 15.0294C2.76263 14.37 2.76263 13.5599 3.14283 12.9006C3.52303 12.2411 4.22681 11.8495 4.99268 11.8495C5.46782 11.8495 5.92211 11.9961 6.30231 12.2612L6.8778 12.6625L7.33757 12.2285C7.71261 11.8741 8.21203 11.6799 8.73001 11.6799C9.24799 11.6799 9.74741 11.8741 10.1224 12.2285L10.5822 12.6625L11.1577 12.2612C11.5379 11.9961 11.9922 11.8495 12.4673 11.8495C13.313 11.8495 14.0772 12.3276 14.4727 13.067L14.8001 13.68H15.5C15.8315 13.68 16.1495 13.8116 16.3839 14.046C16.6183 14.2804 16.75 14.5984 16.75 14.93C16.75 15.2615 16.6183 15.5795 16.3839 15.8139C16.1495 16.0483 15.8315 16.18 15.5 16.18H15V17" stroke="${'var(--icon-cloud)'}" stroke-width="2" stroke-linecap="round"/><path d="M6 19L8 21" stroke="${'var(--text-white)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 19L12 21" stroke="${'var(--text-white)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 19L16 21" stroke="${'var(--text-white)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 19L20 21" stroke="${'var(--text-white)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,

        };

        const weatherCodeMap = {
            0: { desc: 'Sereno', iconMain: icons.clear, iconSmall: icons.clear },
            1: { desc: 'Poco Nuvoloso', iconMain: icons.partlyCloudy, iconSmall: icons.partlyCloudy },
            2: { desc: 'Nuvoloso', iconMain: icons.cloudy, iconSmall: icons.cloudy },
            3: { desc: 'Coperto', iconMain: icons.cloudy, iconSmall: icons.cloudy },
            45: { desc: 'Nebbia', iconMain: icons.cloudy, iconSmall: icons.cloudy },
            61: { desc: 'Pioggia', iconMain: icons.rain, iconSmall: icons.rain },
            63: { desc: 'Pioggia', iconMain: icons.rain, iconSmall: icons.rain },
            71: { desc: 'Neve', iconMain: icons.snow, iconSmall: icons.snow },
            95: { desc: 'Temporale', iconMain: icons.storm, iconSmall: icons.storm }
        };

        const daysOfWeek = ['DOM', 'LUN', 'MAR', 'MER', 'GIO', 'VEN', 'SAB'];

        async function fetchWeather() {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Europe%2FRome`);
                const data = await response.json();
                updateCurrentWeather(data);
                updateForecast(data.daily);
            } catch (error) {
                console.error("Errore:", error);
                document.getElementById('current-desc').innerText = "Errore di connessione";
            }
        }

        function updateCurrentWeather(data) {
            const current = data.current_weather;
            const daily = data.daily;
            const weatherInfo = weatherCodeMap[current.weathercode] || { desc: 'Nuvoloso', iconMain: icons.cloudy };

            document.getElementById('current-temp').innerText = `${Math.round(current.temperature)}°C`;
            document.getElementById('current-desc').innerText = weatherInfo.desc;
            document.getElementById('current-icon-wrapper').innerHTML = weatherInfo.iconMain;
            document.getElementById('current-max').innerText = `${Math.round(daily.temperature_2m_max[0])}°C`;
            document.getElementById('current-min').innerText = `${Math.round(daily.temperature_2m_min[0])}°C`;
        }

        function updateForecast(daily) {
            const container = document.getElementById('forecast-container');
            container.innerHTML = '';
            for (let i = 0; i < 7; i++) {
                const dateObj = new Date(daily.time[i]);
                const dayName = daysOfWeek[dateObj.getDay()];
                const dateNum = `${dateObj.getDate()}/${dateObj.getMonth() + 1}`;
                const weatherInfo = weatherCodeMap[daily.weathercode[i]] || { iconSmall: icons.cloudy };
                
                const cardHTML = `
                    <div class="forecast-card">
                        <div class="forecast-date">
                            <p class="forecast-day">${dayName}</p>
                            <p class="forecast-num">${dateNum}</p>
                        </div>
                        <div class="forecast-icon">${weatherInfo.iconSmall}</div>
                        <div class="forecast-temps">
                            <p class="max">${Math.round(daily.temperature_2m_max[i])}°</p>
                            <p class="min">${Math.round(daily.temperature_2m_min[i])}°</p>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            }
        }

        fetchWeather();
    </script>
</body>
</html>
