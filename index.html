<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteo Sommariva del Bosco</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Variabili Tema Chiaro (Ottimizzato per alto contrasto e anti-abbagliamento LED) */
        :root {
            --bg-page: #d4d4d9;
            --bg-widget: #e5e5ea;
            --bg-section: #d1d1d6;
            --text-primary: #000000;
            --text-secondary: #3a3a3c;
            --text-desc: #1c1c1e;
            --border-color: #a1a1a6;
            --shadow-color: rgba(0, 0, 0, 0.15);
            --icon-shadow: rgba(0, 0, 0, 0.15);
            --city-gradient: linear-gradient(90deg, #0056b3, #0077ff);
        }

        /* Variabili Tema Scuro (Attivato di notte) */
        body.dark-mode {
            --bg-page: #0d1117;
            --bg-widget: #12141c;
            --bg-section: #1a1e29;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --text-desc: #cbd5e1;
            --border-color: #2d3748;
            --shadow-color: rgba(0, 0, 0, 0.6);
            --icon-shadow: rgba(255, 215, 0, 0.4);
            --city-gradient: linear-gradient(90deg, #3ab0ff, #00f2fe);
        }

        /* Reset e Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* Dimensioni widget inalterate, riempimento ottimizzato */
        #weather-widget {
            width: 1240px;
            height: 700px;
            background-color: var(--bg-widget);
            border-radius: 20px;
            padding: 35px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 50px var(--shadow-color);
            transform: scale(0.55);
            transition: background-color 0.5s ease, box-shadow 0.5s ease;
        }

        /* Sezione Superiore (Oggi) */
        .top-section {
            background-color: var(--bg-section);
            border-radius: 20px;
            padding: 30px 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 270px;
            transition: background-color 0.5s ease;
        }

        .city-info h1 {
            font-size: 66px; /* Ingrandito */
            line-height: 1.05;
            font-weight: 800;
            background: var(--city-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .source-text {
            color: var(--text-secondary);
            margin-top: 15px;
            font-size: 20px; /* Ingrandito */
        }

        .source-text span { color: #f39c12; font-weight: 800; }

        .current-weather {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .current-icon svg {
            width: 150px; /* Ingrandito */
            height: 150px;
            filter: drop-shadow(0 0 15px var(--icon-shadow));
        }

        .current-temp-info {
            display: flex;
            flex-direction: column;
        }

        .current-temp {
            font-size: 110px; /* Ingrandito */
            font-weight: 800;
            line-height: 0.95;
            letter-spacing: -3px;
        }

        .current-desc {
            font-size: 34px; /* Ingrandito notevolmente */
            color: var(--text-desc);
            margin-top: 15px;
            font-weight: 800;
        }

        .min-max-today {
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 28px; /* Ingrandito */
            font-weight: 800;
            border-left: 3px solid var(--border-color);
            padding-left: 35px;
            gap: 15px;
            transition: border-color 0.5s ease;
        }

        .t-max { color: #ff5252; }
        .t-min { color: #0099ff; }

        /* Sezione Inferiore (7 Giorni) */
        .forecast-section {
            display: flex;
            justify-content: space-between;
            height: 340px;
        }

        .day-card {
            background-color: var(--bg-section);
            width: 155px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 5px;
            justify-content: space-between;
            transition: transform 0.2s, background-color 0.5s ease;
        }

        .day-name { font-size: 26px; font-weight: 800; color: #0099ff; }
        
        .day-date { 
            font-size: 18px; /* Ingrandito */
            color: var(--text-secondary); 
            margin-top: 5px;
            font-weight: 600;
        }
        
        .day-icon svg {
            width: 75px; /* Ingrandito */
            height: 75px;
            margin: 10px 0;
        }

        .day-desc {
            font-size: 19px; /* Ingrandito */
            color: var(--text-desc);
            text-align: center;
            font-weight: 800;
            height: 48px; /* Adattato per ospitare due righe comode */
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.1;
            padding: 0 5px;
        }

        .day-temps {
            text-align: center;
            margin-top: 15px;
            font-size: 26px; /* Ingrandito */
            font-weight: 800;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div id="weather-widget">
        <!-- Top Section -->
        <div class="top-section">
            <div class="city-info">
                <h1>SOMMARIVA<br>DEL BOSCO</h1>
                <div class="source-text">((•)) Fonte: <span>Open-Meteo</span></div>
            </div>
            
            <div class="current-weather">
                <div class="current-icon" id="current-icon"></div>
                <div class="current-temp-info">
                    <div class="current-temp" id="current-temp">--°C</div>
                    <div class="current-desc" id="current-desc">Caricamento...</div>
                </div>
            </div>

            <div class="min-max-today">
                <div>Max: <span class="t-max" id="today-max">--°C</span></div>
                <div>Min: <span class="t-min" id="today-min">--°C</span></div>
            </div>
        </div>

        <!-- Bottom Section (7 Days) -->
        <div class="forecast-section" id="forecast-container">
            <!-- I giorni verranno generati dinamicamente via JS -->
        </div>
    </div>

    <script>
        const LAT = 44.7667;
        const LON = 7.7833;

        const icons = {
            sun: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="#ffd700"/><g stroke="#ffd700" stroke-width="6" stroke-linecap="round"><line x1="50" y1="5" x2="50" y2="15"/><line x1="50" y1="85" x2="50" y2="95"/><line x1="5" y1="50" x2="15" y2="50"/><line x1="85" y1="50" x2="95" y2="50"/><line x1="18" y1="18" x2="25" y2="25"/><line x1="75" y1="75" x2="82" y2="82"/><line x1="18" y1="82" x2="25" y2="75"/><line x1="75" y1="25" x2="82" y2="18"/></g></svg>`,
            partlyCloudy: `<svg viewBox="0 0 100 100"><circle cx="40" cy="40" r="20" fill="#ffd700"/><path d="M75,65 a15,15 0 0,0 -10,-14 a20,20 0 0,0 -35,5 a15,15 0 0,0 5,29 h40 a15,15 0 0,0 0,-20 z" fill="#a0aec0"/></svg>`,
            cloudy: `<svg viewBox="0 0 100 100"><path d="M75,65 a15,15 0 0,0 -10,-14 a20,20 0 0,0 -35,5 a15,15 0 0,0 5,29 h40 a15,15 0 0,0 0,-20 z" fill="#8892b0"/></svg>`,
            lightRain: `<svg viewBox="0 0 100 100"><path d="M75,55 a15,15 0 0,0 -10,-14 a20,20 0 0,0 -35,5 a15,15 0 0,0 5,29 h40 a15,15 0 0,0 0,-20 z" fill="#6a35ff"/><line x1="40" y1="80" x2="35" y2="95" stroke="#b185ff" stroke-width="4" stroke-linecap="round"/><line x1="60" y1="80" x2="55" y2="95" stroke="#b185ff" stroke-width="4" stroke-linecap="round"/></svg>`,
            heavyRain: `<svg viewBox="0 0 100 100" style="filter: drop-shadow(0 0 10px #6a35ff);"><path d="M75,55 a15,15 0 0,0 -10,-14 a20,20 0 0,0 -35,5 a15,15 0 0,0 5,29 h40 a15,15 0 0,0 0,-20 z" fill="#9d4edd"/><line x1="30" y1="80" x2="25" y2="95" stroke="#e0aaff" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="80" x2="45" y2="95" stroke="#e0aaff" stroke-width="4" stroke-linecap="round"/><line x1="70" y1="80" x2="65" y2="95" stroke="#e0aaff" stroke-width="4" stroke-linecap="round"/></svg>`,
            storm: `<svg viewBox="0 0 100 100"><path d="M75,50 a15,15 0 0,0 -10,-14 a20,20 0 0,0 -35,5 a15,15 0 0,0 5,29 h40 a15,15 0 0,0 0,-20 z" fill="#4a4e69"/><polygon points="45,65 55,65 40,85 50,85 35,100" fill="#ffd700"/><line x1="65" y1="75" x2="60" y2="90" stroke="#b185ff" stroke-width="4" stroke-linecap="round"/></svg>`,
            snow: `<svg viewBox="0 0 100 100"><path d="M75,55 a15,15 0 0,0 -10,-14 a20,20 0 0,0 -35,5 a15,15 0 0,0 5,29 h40 a15,15 0 0,0 0,-20 z" fill="#caf0f8"/><circle cx="40" cy="85" r="3" fill="#fff"/><circle cx="60" cy="85" r="3" fill="#fff"/><circle cx="50" cy="95" r="3" fill="#fff"/></svg>`
        };

        function getWeatherInfo(code) {
            if (code === 0) return { desc: "Soleggiato", icon: icons.sun };
            if (code === 1 || code === 2) return { desc: "Poco Nuvoloso", icon: icons.partlyCloudy };
            if (code === 3) return { desc: "Nuvoloso", icon: icons.cloudy };
            if (code === 45 || code === 48) return { desc: "Poco Nuvoloso", icon: icons.cloudy };
            if (code === 51 || code === 53 || code === 55) return { desc: "Pioviggine", icon: icons.lightRain };
            if (code === 61 || code === 63) return { desc: "Pioggia Lieve", icon: icons.lightRain };
            if (code === 65) return { desc: "Pioggia Forte", icon: icons.heavyRain };
            if (code === 71 || code === 73 || code === 75 || code === 77) return { desc: "Neve", icon: icons.snow };
            if (code === 80 || code === 81 || code === 82) return { desc: "Acquazzone", icon: icons.heavyRain };
            if (code === 95 || code === 96 || code === 99) return { desc: "Temporale", icon: icons.storm };
            return { desc: "Variabile", icon: icons.partlyCloudy };
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const days = ['DOM', 'LUN', 'MAR', 'MER', 'GIO', 'VEN', 'SAB'];
            return {
                dayName: days[date.getDay()],
                dayDate: `${date.getDate()}/${date.getMonth() + 1}`
            };
        }

        async function fetchWeather() {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Europe%2FRome`;
                const response = await fetch(url);
                const data = await response.json();

                const current = data.current_weather;
                
                if (current.is_day === 0) {
                    document.body.classList.add('dark-mode');
                } else {
                    document.body.classList.remove('dark-mode');
                }
                
                const todayInfo = getWeatherInfo(current.weathercode);
                
                document.getElementById('current-temp').innerText = `${Math.round(current.temperature)}°C`;
                document.getElementById('current-desc').innerText = todayInfo.desc;
                document.getElementById('current-icon').innerHTML = todayInfo.icon;
                
                document.getElementById('today-max').innerText = `${Math.round(data.daily.temperature_2m_max[0])}°C`;
                document.getElementById('today-min').innerText = `${Math.round(data.daily.temperature_2m_min[0])}°C`;

                const forecastContainer = document.getElementById('forecast-container');
                forecastContainer.innerHTML = '';

                for (let i = 0; i < 7; i++) {
                    const dateInfo = formatDate(data.daily.time[i]);
                    const wInfo = getWeatherInfo(data.daily.weathercode[i]);
                    const maxT = Math.round(data.daily.temperature_2m_max[i]);
                    const minT = Math.round(data.daily.temperature_2m_min[i]);

                    const cardHTML = `
                        <div class="day-card">
                            <div style="text-align: center;">
                                <div class="day-name">${dateInfo.dayName}</div>
                                <div class="day-date">${dateInfo.dayDate}</div>
                            </div>
                            <div class="day-icon">
                                ${wInfo.icon}
                            </div>
                            <div class="day-desc">${wInfo.desc}</div>
                            <div class="day-temps">
                                <span class="t-max">${maxT}°</span>
                                <span class="t-min">${minT}°</span>
                            </div>
                        </div>
                    `;
                    forecastContainer.innerHTML += cardHTML;
                }

            } catch (error) {
                console.error("Errore nel caricamento del meteo", error);
                document.getElementById('current-desc').innerText = "Errore";
            }
        }

        fetchWeather();
    </script>
</body>
</html>
